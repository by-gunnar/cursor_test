<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="spotlight" aria-hidden="true"></div>

    <main class="stage">
      <p class="brand" id="greeting" data-lang="EN">Hello World</p>
      <h1>Interactive greeting lab</h1>
      <p class="lede">
        Move around. Tap the buttons. Watch the page answer back.
      </p>

      <div class="controls" role="group" aria-label="Hello World controls">
        <button type="button" class="btn btn--primary" id="burstBtn">
          Burst hello!
        </button>
        <button type="button" class="btn" id="langBtn">Next language</button>
        <button type="button" class="btn" id="paletteBtn">Shift palette</button>
      </div>

      <p class="meta">
        Language <span id="langTag">EN</span>
        · Palette <span id="paletteTag">Tide</span>
        · Bursts <span id="burstCount">0</span>
      </p>
    </main>

    <div class="floaters" id="floaters" aria-hidden="true"></div>
    <script src="script.js"></script>
  </body>
</html>
